[project]
name = "research-council"
version = "0.1.0"
description = "Multi-model research council driven from Notion, using subscription CLIs"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
crawl = ["crawl4ai>=0.6"]

[project.scripts]
research = "research_council.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
